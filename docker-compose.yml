services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finiq
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d finiq"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  ml:
    build: ./ml-service
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/finiq
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET with at least 32 characters}
      FRONTEND_URL: ${COMPOSE_FRONTEND_URL:-http://localhost:8088}
      ML_URL: http://ml:8001
      RESET_MODE: ${COMPOSE_RESET_MODE:-disabled}
      RESET_DIRECTORY: /home/finiq/reset-mail
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - reset_mail:/home/finiq/reset-mail
    depends_on:
      database:
        condition: service_healthy
      ml:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  reset_mail:
