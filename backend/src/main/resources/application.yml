server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finiq}
    username: ${DB_USER:finiq}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
finiq:
  jwt-secret: ${JWT_SECRET}
  cors-origin: ${FRONTEND_URL:http://localhost:5173}
  ml-url: ${ML_URL:http://localhost:8001}
  reset-mode: ${RESET_MODE:disabled}
  reset-directory: ${RESET_DIRECTORY:.runtime/reset-mail}
  mail-from: ${MAIL_FROM:}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
management:
  health.mail.enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
springdoc:
  swagger-ui.path: /docs
